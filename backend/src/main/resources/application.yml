spring:
  application:
    name: devhub-backend
  profiles:
    active: dev
  datasource:
    url: ${NEON_DATABASE_URL}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

devhub:
  jwt:
    secret: ${JWT_SECRET}
    # 15 minutes = 900,000 ms
    access-expiration-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
    # 7 days = 604,800,000 ms
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
  security:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    resumes-dir: ${RESUME_STORAGE_DIR:./uploads/resumes}
  ai:
    gemini-api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-flash-latest}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/github/callback}
