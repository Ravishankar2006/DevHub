# ==============================================================
# DevHub — Local Dev Services (Docker Compose)
# Local development only — production uses Neon + Render.
# ==============================================================
# Usage: docker compose up -d

services:
  postgres:
    image: postgres:16
    container_name: devhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devhub
      POSTGRES_USER: devhub
      POSTGRES_PASSWORD: devhub_local_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devhub -d devhub"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
